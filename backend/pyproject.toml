[project]
name = "mosaique"
version = "0.1.0"
description = "Mosaique - realtime meeting intelligence, French-first"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-ulid>=3.0",
    "pyjwt>=2.10",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "psycopg[binary]>=3.2",
    # The replay harness drives the gateway over a real socket, so it needs a
    # real client. It arrives transitively via uvicorn[standard]; naming it
    # here keeps the harness working if that ever changes.
    "websockets>=13.0",
]

# ADR-13 consequence 5. MLX is macOS/arm64 only, so it is an extra behind an
# environment marker: `uv pip install -e ".[dev]"` has to keep working in a
# Linux sandbox and in CI, and a plain dependency would break both. The
# `moshi_mlx` pin is the release whose loader `mlx_runtime.py` mirrors —
# deviating would mean running something upstream does not ship.
mlx = [
    "moshi_mlx==0.2.12; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sentencepiece>=0.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface_hub>=0.26; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sphn>=0.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# The deployment runtime. No platform marker: any host can reach a remote
# `moshi-server`. Unverified — no CUDA machine exists yet (Spike B2).
moshi-server = [
    "websockets>=13.0",
    "msgpack>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaique"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates long op.create_index lines; reformatting them by hand
# would make future autogenerate diffs noisy for no benefit.
"src/mosaique/persistence/migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"moshi".msg = "Model-specific imports belong in speech/adapters/kyutai only (tech spec 9.1)."

[tool.mypy]
python_version = "3.12"
strict = true
# `tools/spike_b1` is on the path because the spike is a standalone PEP 723
# script, not an installed package (ADR-13 consequence 5 keeps MLX out of this
# project's dependencies), so its modules are imported by bare name.
mypy_path = "src:.:tools/spike_b1"
packages = ["mosaique", "tools.replay"]
# The two halves of Spike B1 that contain no MLX import. `probe.py` is
# deliberately absent: it imports a model library that cannot be installed on
# Linux, so type-checking it would fail everywhere except one laptop.
modules = ["b1_analysis", "b1_summary"]
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# The ASR runtimes' own libraries. None of them can be installed on the machine
# this project is developed on — MLX is macOS/arm64 only (ADR-13 consequence 5)
# and msgpack rides with the moshi-server extra — so mypy is told they are
# absent on purpose rather than missing by accident. Every call into them is
# already confined to `speech/adapters/kyutai/mlx_runtime.py` and
# `asr_runtime/moshi_ws.py`, which is what `test_architecture.py` enforces, so
# the blast radius of the untyped surface is two files.
[[tool.mypy.overrides]]
module = [
    "mlx",
    "mlx.*",
    "moshi_mlx",
    "moshi_mlx.*",
    "sentencepiece",
    "huggingface_hub",
    "numpy",
    "msgpack",
    "sphn",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# "." puts `tools.replay` on the path: the harness is exercised by the
# integration suite, not only by hand.
pythonpath = ["src", "."]
markers = [
    "integration: requires PostgreSQL",
    "slow: minutes, not seconds; run deliberately with `-m slow`",
]
# A marker does not deselect on its own. Without this the accelerated-hour test
# runs on every `pytest -q` and turns a one-minute suite into a twenty-minute
# one. `-m slow` on the command line overrides this and selects it.
addopts = ["-m", "not slow"]
