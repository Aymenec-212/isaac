# Shared settings for the isolated local relay gate.
listening-ip=0.0.0.0
listening-port=3478
min-port=49160
max-port=49179
realm=mosaique.local.test
use-auth-secret
fingerprint
no-cli
no-tls
no-dtls
no-tcp-relay
no-multicast-peers
user-quota=4
total-quota=16
max-allocate-lifetime=600
log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
