<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mosaïque</title>
    <!--
      The two faces are served from this origin (public/fonts/). Preload only
      the `latin` subsets: they carry French, and the `latin-ext` files are
      fetched by the browser only if a glyph outside latin actually appears.
      `crossorigin` is required even same-origin — fonts are fetched in
      anonymous CORS mode, and without it the preload is simply downloaded
      twice.
    -->
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
